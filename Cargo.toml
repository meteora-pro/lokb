[workspace]
resolver = "2"
members = [
    "crates/lokb-core",
    "crates/lokb-pipeline",
    "crates/lokb-storage",
    "crates/lokb-optimize",
    "crates/lokb-ingest",
    "crates/lokb-parsers",
    "crates/lokb-search",
    "crates/lokb-embed",
    "crates/lokb-llm",
    "crates/lokb-graph",
    "crates/lokb-render",
    "crates/lokb-serve",
    "crates/lokb-tools",
    "crates/lokb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meteora-pro/lokb"

[workspace.dependencies]
lokb-core = { path = "crates/lokb-core" }
lokb-pipeline = { path = "crates/lokb-pipeline" }
lokb-storage = { path = "crates/lokb-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tantivy = "0.22"
htmd = "0.5"
zip = "2"
quick-xml = "0.37"
pdf-extract = "0.10"
fastembed = "5"
memmap2 = "0.9"
xz2 = "0.1"
zstd = "0.13"
flate2 = "1"
mail-parser = "0.9"
kamadak-exif = "0.5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tar = "0.4"
notify = "7"
notify-debouncer-mini = "0.4"
